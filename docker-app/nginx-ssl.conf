# HTTPS listener for the nginx image (Dockerfile copies this file to
# /etc/nginx/conf.d/ssl.conf; the entrypoint-rendered nginx.conf includes it).
#
# The image serves the application on both 8080 (plain HTTP, defined by the
# rendered nginx.conf) and 8443 (this TLS server). This file deliberately
# does NOT redirect HTTP to HTTPS: the documented quick start serves plain
# HTTP on 8080 so first runs on http://localhost:8080 need no certificate
# click-through. To instead force HTTPS, replace the port-8080 server in
# nginx.conf.template with a `return 301 https://$host:8443$request_uri;`
# location and rebuild the image.
server {
    listen 8443 ssl http2;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https:; img-src 'self' data: blob: https:; media-src 'self' blob:;" always;

    # Performance settings
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot|otf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Model files with CORS
    location /models/ {
        add_header Access-Control-Allow-Origin *;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Model cache directory
    location /model-cache/ {
        add_header Access-Control-Allow-Origin *;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
    }

    # Metrics are not collected by this application; keep the endpoint explicit
    location = /metrics {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not_found","path":"/metrics"}';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
