version: '3.8'

services:
  # Face Detection App without prefix (default deployment)
  face-detection-default:
    # Dockerfile is the nginx image: it generates a self-signed certificate
    # during the build and listens on both HTTP and HTTPS.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health && curl -sfk https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Replacement-certificate example. Put selfsigned.crt and selfsigned.key
  # in ./ssl first, then run:
  #   docker compose --profile custom-cert up face-detection-custom-cert
  # The mount replaces the generated pair, so both files are required.
  face-detection-custom-cert:
    profiles: ["custom-cert"]
    extends:
      service: face-detection-default
    volumes:
      - ./ssl:/etc/nginx/ssl:ro

  # Face Detection App with custom prefix
  face-detection-prefixed:
    build: .
    ports:
      - "8081:8080"
    environment:
      - APP_PREFIX=/face-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Multiple instances with different prefixes (for multi-tenant scenarios)
  face-detection-tenant-a:
    build: .
    ports:
      - "8082:8080"
    environment:
      - APP_PREFIX=/tenant-a
    restart: unless-stopped

  face-detection-tenant-b:
    build: .
    ports:
      - "8083:8080"
    environment:
      - APP_PREFIX=/tenant-b
    restart: unless-stopped

  # Example with reverse proxy (nginx)
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - face-detection-prefixed
      - face-detection-tenant-a
      - face-detection-tenant-b
    restart: unless-stopped

# Example networks for service isolation
networks:
  face-detection-network:
    driver: bridge

# Example volumes for persistent data (if needed)
volumes:
  face-detection-data:
    driver: local
