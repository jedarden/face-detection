user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with performance metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main buffer=16k;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; media-src 'self' blob:; worker-src 'self' blob:;" always;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security
        server_tokens off;

        # Cache hashed webpack bundles (content-based hash in filename)
        location ~* "^(.+)\.([0-9a-f]{8,})\.(js|css)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache static assets that are truly static (images, fonts, wasm)
        location ~* \.(jpg|jpeg|png|gif|woff|woff2|ttf|svg|eot|otf|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # favicon.ico is static but has no hash
        location = /favicon.ico {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Unhashed JavaScript files - short cache with revalidation
        location ~* ^/[^/]+\.js$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Unhashed CSS files - short cache with revalidation
        location ~* ^/[^/]+\.css$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # HTML and JSON files - no cache
        location ~* \.(html|json)$ {
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # Specific handling for face-api.js model files
        location /models/ {
            add_header Access-Control-Allow-Origin *;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"healthy","version":"1.0.0","timestamp":"$time_iso8601","services":{"nginx":"running","face-detection":"available"},"features":{"lite_mode":true,"pro_mode":true,"tensorflow_js":true,"face_api_js":true}}';
        }

        # Performance metrics endpoint
        location /metrics {
            access_log off;
            return 200 "nginx_up 1\nnginx_requests_total $request_completion\nnginx_connections_active $connections_active\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
